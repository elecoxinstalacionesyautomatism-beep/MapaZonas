<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapaZonas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: 100vh; }
    .combined-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.35));
    }

    .custom-marker-icon {
      background: transparent !important;
      border: 0 !important;
    }

    .marker-half {
      align-items: center;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      flex: 0 0 auto;
      align-self: center;
    }

    .marker-top {
      background: #2E7D32;
      border-radius: 999px 999px 0 0;
    }

    .marker-bottom {
      background: #1565C0;
      border-radius: 0 0 999px 999px;
    }

    .province-label {
      background: transparent; border: 0; color: #1f2937; font-size: 12px;
      font-weight: 700; line-height: 1; text-align: center; white-space: nowrap;
      text-shadow: -1px -1px #fff, 1px -1px #fff, -1px 1px #fff, 1px 1px #fff;
    }
    .store-marker {
      background: #2E7D32;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding: 7px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main id="map" aria-label="Tiendas por provincia"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([40.4168, -3.7038], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const provinces = [
      ['A Coruña',4,43.15,-8.55], ['Albacete',2,38.99,-1.86],
      ['Alicante',5,38.35,-0.49], ['Almería',2,36.84,-2.46],
      ['Asturias',2,43.36,-5.85], ['Badajoz',2,38.88,-6.97],
      ['Barcelona',13,41.67,2.00], ['Burgos',2,42.34,-3.70],
      ['Cáceres',1,39.52,-6.37], ['Cádiz',6,36.52,-5.85],
      ['Cantabria',2,43.18,-3.80], ['Castellón',2,40.20,-0.15],
      ['Ceuta',1,35.89,-5.31], ['Ciudad Real',2,39.00,-3.93],
      ['Córdoba',3,37.90,-4.78], ['Girona',2,42.12,2.75],
      ['Granada',5,37.20,-3.60], ['Guipúzcoa',3,43.15,-2.20],
      ['Huelva',1,37.60,-6.90], ['Islas Baleares',5,39.60,2.90],
      ['Jaén',2,37.78,-3.80], ['La Rioja',1,42.46,-2.45],
      ['Las Palmas',4,28.15,-15.45], ['León',3,42.60,-5.57],
      ['Lleida',1,41.62,0.62], ['Lugo',1,43.01,-7.56],
      ['Madrid',17,40.42,-3.70], ['Málaga',6,36.82,-4.75],
      ['Murcia',4,37.99,-1.13], ['Navarra',4,42.75,-1.65],
      ['Ourense',1,42.25,-7.75], ['Pontevedra',3,42.43,-8.65],
      ['Salamanca',3,40.75,-6.00], ['Santa Cruz de Tenerife',8,28.30,-16.60],
      ['Sevilla',7,37.39,-5.98], ['Tarragona',2,41.12,1.10],
      ['Toledo',3,39.86,-4.02], ['Valencia',4,39.47,-0.38],
      ['Valladolid',2,41.65,-4.72], ['Vizcaya',3,43.25,-2.93],
      ['Zaragoza',2,41.65,-0.88]
    ];
    const employees = {
      'A Coruña': 2, 'Alicante': 5, 'Asturias': 2, 'Barcelona': 7,
      'Guipúzcoa': 0, 'Jaén': 0, 'La Rioja': 7, 'León': 1,
      'Madrid': 26, 'Salamanca': 1, 'Valencia': 2, 'Valladolid': 1,
      'Pontevedra': 1, 'Vizcaya': 2, 'Zaragoza': 7
    };
    const maxStores = Math.max(...provinces.map(([, count]) => count));
    const maxEmployees = Math.max(...Object.values(employees));

    provinces.forEach(([name, count, lat, lng]) => {
      const employeeCount = employees[name] || 0;
      const topSize = 24 + (count / maxStores) * 44;
      const bottomSize = employeeCount > 0
        ? 24 + (employeeCount / maxEmployees) * 44
        : 0;
      const markerWidth = Math.max(topSize, bottomSize);
      const topHeight = topSize / 2;
      const bottomHeight = bottomSize / 2;
      const totalHeight = topHeight + bottomHeight;

      L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'custom-marker-icon',
          html: '<div class="combined-marker" style="width:' + markerWidth + 'px;height:' + totalHeight + 'px">' +
            '<div class="marker-half marker-top" style="width:' + topSize + 'px;height:' + topHeight + 'px">' + count + '</div>' +
            (employeeCount > 0
              ? '<div class="marker-half marker-bottom" style="width:' + bottomSize + 'px;height:' + bottomHeight + 'px">' + employeeCount + '</div>'
              : '') +
            '</div>',
          iconSize: [markerWidth, totalHeight],
          iconAnchor: [markerWidth / 2, totalHeight]
        })
      })
        .bindTooltip('<strong>' + name + '</strong><br>Tiendas: ' + count +
          (employeeCount > 0 ? '<br>Trabajadores: ' + employeeCount : ''), {
          direction: 'top',
          sticky: true
        })
        .addTo(map);

      L.marker([lat + 0.42, lng], {
        icon: L.divIcon({
          className: 'province-label',
          html: name,
          iconSize: [180, 20],
          iconAnchor: [90, 10]
        }),
        interactive: false
      }).addTo(map);
    });
  </script>
</body>
</html>
